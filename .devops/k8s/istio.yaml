# Edge for both repos. The TLS secret `statistics-tls` lives in the ingress gateway's namespace (usually istio-system).
# Later, when needed: DestinationRule (pools, outlier detection), AuthorizationPolicy (who may call whom).
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: statistics-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - stats.example.com
      tls:
        mode: SIMPLE
        credentialName: statistics-tls
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - stats.example.com
      tls:
        httpsRedirect: true
---
# The only VirtualService for the host: Istio does not order routes across VirtualServices.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: statistics
spec:
  hosts:
    - stats.example.com
  gateways:
    - statistics-gateway
  http:
    # REST API, ingest and Swagger UI (/api/v2/swagger); /health and /ready stay cluster-internal
    - name: api
      match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: statistics-service
            port:
              number: 8080
    # web UI, same origin as the API
    - name: ui
      route:
        - destination:
            host: statistics-ui.statistics.svc.cluster.local
            port:
              number: 8080
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls:
    mode: STRICT
