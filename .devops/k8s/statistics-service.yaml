apiVersion: v1
kind: ServiceAccount
metadata:
  name: statistics-service
  namespace: apps
  labels:
    app.kubernetes.io/name: statistics-service
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statistics-service
  namespace: apps
  labels:
    app.kubernetes.io/name: statistics-service
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: statistics-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statistics-service
        app.kubernetes.io/version: "0.0.1"
        app.kubernetes.io/part-of: homelab
    spec:
      serviceAccountName: statistics-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/jagieloadrian/statistics-service:main-20261028120000-abc1234
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: statistics-service-config
            - secretRef:
                name: statistics-service-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: statistics-service
  namespace: apps
  labels:
    app.kubernetes.io/name: statistics-service
    app.kubernetes.io/part-of: homelab
spec:
  selector:
    app.kubernetes.io/name: statistics-service
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: statistics-service
  namespace: apps
  labels:
    app.kubernetes.io/name: statistics-service
    app.kubernetes.io/part-of: homelab
spec:
  parentRefs:
    - name: home-gateway
      namespace: istio-ingress
      sectionName: http
  hostnames:
    - statistics.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: statistics-service
          port: 80
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: statistics-service
  namespace: apps
  labels:
    app.kubernetes.io/name: statistics-service
    app.kubernetes.io/part-of: homelab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: statistics-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-ingress/sa/home-gateway-istio
