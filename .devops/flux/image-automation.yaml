apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: statistics-service
  namespace: flux-system
spec:
  image: ghcr.io/jagieloadrian/statistics-service
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: statistics-service
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: statistics-service
  filterTags:
    pattern: '^main-(?P<ts>[0-9]{14})-[a-f0-9]{7}$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
