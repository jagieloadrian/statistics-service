name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write # deploy step commits the new image tag to .devops/k8s
  packages: write

env:
  IMAGE: ghcr.io/jagieloadrian/statistics-service

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew check

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Compute image tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        run: >
          ./gradlew jib
          -Djib.to.image=${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          -Djib.to.auth.username=${{ github.actor }}
          -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      # Flux reads .devops/k8s from main; a push made with GITHUB_TOKEN does not trigger another run.
      - name: Deploy (bump image tag)
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i -E "s#(image: ${{ env.IMAGE }}):[^[:space:]]+#\1:${{ steps.tag.outputs.tag }}#" .devops/k8s/*.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(deploy): ${{ steps.tag.outputs.tag }}"
          git pull --rebase && git push
